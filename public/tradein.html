<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Trade-in — Mandarin</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151e35;--line:#293653;--orange:#ff9b35;--muted:#aab4c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui;padding:18px 14px 40px;max-width:650px;margin:auto}a{color:inherit;text-decoration:none}.back{display:inline-block;color:var(--orange);margin-bottom:18px}.hero{background:linear-gradient(135deg,#42240e,#191c38);border:1px solid #594027;border-radius:20px;padding:18px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:23px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}label{display:block;margin:12px 0 6px;font-weight:650}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0d1529;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:13px;padding:14px;background:var(--orange);color:#211305;font-size:16px;font-weight:800;margin-top:14px}button:disabled{opacity:.5}#preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px;display:none}.result{white-space:pre-wrap;line-height:1.6}.warn{font-size:12px;color:#f5c78b;line-height:1.5}.hidden{display:none}.err{color:#ff9c9c}
</style></head><body>
<a class="back" href="/">← Do‘konga qaytish</a>
<div class="hero"><h1>🤖 AI Trade-in</h1><div class="muted">Eski telefoningiz rasmini yuboring — AI modelini va tashqi holatini dastlabki baholaydi.</div></div>
<div class="card"><label>Telefon modeli (bilganingizcha)</label><input id="model" maxlength="100" placeholder="Masalan: iPhone 13 Pro 128GB">
<label>Telefon rasmini yuklang</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" alt="Telefon rasmi">
<p class="warn">Telefonning oldi va orqa tomonini aniq tushiring. AI batareya, IMEI va ichki nosozlikni rasm orqali tekshira olmaydi.</p>
<button id="go" disabled>✨ AI orqali tekshirish</button></div>
<div id="status" class="muted"></div><div id="out" class="card hidden"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const photo=document.getElementById('photo'),preview=document.getElementById('preview'),go=document.getElementById('go'),statusBox=document.getElementById('status'),out=document.getElementById('out');let selected=null;
photo.addEventListener('change',async()=>{selected=photo.files&&photo.files[0];out.classList.add('hidden');if(!selected){go.disabled=true;preview.style.display='none';return}if(!/^image\/(jpeg|png|webp)$/.test(selected.type)){statusBox.textContent='JPG, PNG yoki WEBP rasm tanlang.';go.disabled=true;return}if(selected.size>12*1024*1024){statusBox.textContent='Rasm 12 MB dan kichik bo‘lsin.';go.disabled=true;return}preview.src=URL.createObjectURL(selected);preview.style.display='block';go.disabled=false;statusBox.textContent='Rasm tayyor.'});
async function compressed(file){const img=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82))}
go.addEventListener('click',async()=>{if(!selected)return;go.disabled=true;go.textContent='AI tekshiryapti…';statusBox.textContent='Rasm tahlil qilinmoqda. Bu 10–30 soniya olishi mumkin.';out.classList.add('hidden');try{const blob=await compressed(selected);if(!blob||blob.size>5*1024*1024)throw new Error('Rasm hajmini kamaytirib bo‘lmadi.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});const headers={'Content-Type':'application/json'};if(tg&&tg.initData)headers['X-Telegram-Init-Data']=tg.initData;const response=await fetch('/api/tradein/analyze',{method:'POST',headers,body:JSON.stringify({image:data,mimeType:'image/jpeg',model:document.getElementById('model').value})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Xatolik yuz berdi.');const a=payload.analysis||{};const lines=['📱 Model: '+(a.model||'Aniqlanmadi'),'🔎 Ishonchlilik: '+(a.confidence||'—'),'⭐ Holati: '+(a.condition||'—'),'⚠️ Ko‘rinadigan nuqsonlar: '+((a.visible_issues||[]).join(', ')||'Ko‘rinmadi'),'🛠 Tekshirish kerak: '+((a.inspection_notes||[]).join(', ')||'—'),'📸 Qo‘shimcha rasmlar: '+((a.need_more_photos||[]).join(', ')||'Kerak emas'),'📝 Xulosa: '+(a.summary||'—'),'',payload.note||''];out.textContent=lines.join('\n');out.classList.remove('hidden');statusBox.textContent='Tahlil tugadi.'}catch(e){statusBox.textContent=e.message;statusBox.classList.add('err')}finally{go.disabled=false;go.textContent='✨ Qayta tekshirish'}});
</script></body></html>
